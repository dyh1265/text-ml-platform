[project]
name = 'text-ml-platform'
version = '0.1.0'
description = 'Production-style text ML platform: Kafka ingestion, medallion architecture, BERT embeddings, and real-time inference.'
readme = 'README.md'
license = { text = 'MIT' }
requires-python = '>=3.10'
authors = [{ name = 'David Huang' }]
keywords = ['ml', 'nlp', 'kafka', 'iceberg', 'bert', 'sentiment']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]

[tool.pytest.ini_options]
testpaths = ['tests']
markers = [
    'integration: marks tests that require running infrastructure (MinIO, Kafka, etc.)',
]
addopts = '-v --tb=short'
filterwarnings = [
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning:httpx.*",
]

[tool.coverage.run]
source = ['src']
omit = [
    'src/ui/*',
    'src/inference/inference_worker.py',
    'src/ingestion/bronze_consumer.py',
    'src/ingestion/producer.py',
    'src/llm/*',
    'src/training/finetune_bert.py',
    'src/inference/inference_request_producer.py',
    'src/utils/kafka_client.py',
]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.ruff]
target-version = 'py310'
line-length = 120

[tool.ruff.lint]
select = [
    'E',
    'W',
    'F',
    'I',
    'UP',
    'B',
    'SIM',
    'RUF',
]
ignore = [
    'E501',
    'B008',
    'RUF012',
]

[tool.ruff.lint.isort]
known-first-party = ['src']

[tool.mypy]
python_version = '3.10'
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
