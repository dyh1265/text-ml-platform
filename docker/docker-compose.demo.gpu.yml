# GPU variant of demo services: uses Dockerfile.gpu and reserves NVIDIA GPU for torch (BERT).
# Requires: NVIDIA Container Toolkit on the host (e.g. nvidia-docker2).
# Run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.demo.gpu.yml up -d --build

services:
  gold_iceberg_test:
    build:
      context: ..
      dockerfile: Dockerfile
    image: text-ml-platform:latest
    command:
      - bash
      - -lc
      - >
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN &&
        pytest -k test_gold_iceberg_table_loads_and_has_snapshots
    networks:
      - app-tier
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_DATA_BUCKET: text-ml-data
      ICEBERG_CATALOG_DB: /app/iceberg_catalog/catalog.db
      GOLD_ICEBERG_IDENTIFIER: imdb.gold_train
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    volumes:
      - ../iceberg_catalog:/app/iceberg_catalog
    depends_on:
      - minio

  prepopulate_imdb:
    build:
      context: ..
      dockerfile: Dockerfile.gpu
    image: text-ml-platform:gpu
    command:
      - bash
      - -lc
      - >
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN &&
        python scripts/check_prepopulated.py && { echo "Already prepopulated."; exit 0; };
        python -m src.ingestion.producer --mode batch --split train --limit 1000 &&
        python -m src.ingestion.producer --mode batch --split test  --limit 1000 &&
        python -m src.ingestion.bronze_consumer --batch-size 50 --limit 2000 &&
        python -m src.transformation.silver_job --bronze-prefix bronze/imdb/train/ --silver-prefix silver/imdb/train/ &&
        python -m src.transformation.silver_job --bronze-prefix bronze/imdb/test/  --silver-prefix silver/imdb/test/ &&
        python -m src.training.finetune_bert --silver-train-prefix silver/imdb/train/ --silver-test-prefix silver/imdb/test/ --output-dir models/bert_sentiment_imdb --device cuda &&
        python -m src.features.embedding_job --silver-prefix silver/imdb/train/ --iceberg --iceberg-namespace imdb --iceberg-table gold_train --bert-path models/bert_sentiment_imdb --device cuda &&
        python -m src.features.embedding_job --silver-prefix silver/imdb/test/  --iceberg --iceberg-namespace imdb --iceberg-table gold_test --bert-path models/bert_sentiment_imdb --device cuda &&
        python -m src.training.train_classifier
        --iceberg-identifier imdb.gold_train
        --test-iceberg-identifier imdb.gold_test
        --train-split train
        --test-split test
        --model-out models/sentiment_logreg.joblib
    networks:
      - app-tier
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_DATA_BUCKET: text-ml-data
      ICEBERG_CATALOG_DB: /app/iceberg_catalog/catalog.db
    volumes:
      - ../models:/app/models
      - ../iceberg_catalog:/app/iceberg_catalog
    depends_on:
      - kafka
      - minio
      - spark
    shm_size: "2gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  bronze_consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: text-ml-platform:latest
    command:
      - bash
      - -lc
      - >
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN &&
        python -m src.ingestion.bronze_consumer --batch-size 50 --split train
    networks:
      - app-tier
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_DATA_BUCKET: text-ml-data
    depends_on:
      - kafka
      - minio
    restart: unless-stopped

  predict_service:
    build:
      context: ..
      dockerfile: Dockerfile.gpu
    image: text-ml-platform:gpu
    command:
      - bash
      - -lc
      - >
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN &&
        python -m src.inference.predict_service
        --finetuned-bert-path models/bert_sentiment_imdb
        --port 8000
        --device cuda
        --iceberg-write
    networks:
      - app-tier
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_DATA_BUCKET: text-ml-data
      ICEBERG_CATALOG_DB: /app/iceberg_catalog/catalog.db
    volumes:
      - ../models:/app/models
      - ../iceberg_catalog:/app/iceberg_catalog
    depends_on:
      - minio
    restart: unless-stopped
    shm_size: "2gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  inference_worker:
    image: text-ml-platform:gpu
    command:
      - bash
      - -lc
      - >
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN &&
        python -m src.inference.inference_worker
        --finetuned-bert-path models/bert_sentiment_imdb
        --device cuda
        --iceberg
        --iceberg-namespace imdb
        --iceberg-table gold_inference
    networks:
      - app-tier
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INFERENCE_TOPIC: imdb-inference
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_DATA_BUCKET: text-ml-data
      ICEBERG_CATALOG_DB: /app/iceberg_catalog/catalog.db
    volumes:
      - ../models:/app/models
      - ../iceberg_catalog:/app/iceberg_catalog
    depends_on:
      - kafka
      - minio
    restart: unless-stopped
    shm_size: "2gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  streamlit:
    image: text-ml-platform:gpu
    command:
      - bash
      - -lc
      - >
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN &&
        streamlit run src/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - app-tier
    ports:
      - "8501:8501"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INFERENCE_TOPIC: imdb-inference
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_DATA_BUCKET: text-ml-data
      PREDICT_API_URL: http://predict_service:8000/predict
      GOLD_ICEBERG_IDENTIFIER: imdb.gold_train
      # Inside container, localhost points to itself; use host gateway for local Ollama.
      OLLAMA_API_BASE: http://host.docker.internal:11434/v1
      ICEBERG_CATALOG_DB: /app/iceberg_catalog/catalog.db
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    volumes:
      - ../iceberg_catalog:/app/iceberg_catalog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - predict_service
    restart: unless-stopped
    shm_size: "2gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
